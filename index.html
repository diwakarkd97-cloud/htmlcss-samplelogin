<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Workshop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Web Development Workshop</h1>
        <h2>Number of available seats: 23</h2> 
      
        <div class="form-container">
            <div class="leftside">
                <img src="./img.jpg" alt="Workshop Image">     
            </div>
            
            <div class="rightside">
                <ul class="form-list">
                    <li><input type="text" placeholder="Username"></li>
                    <li><input type="email" placeholder="Email"></li>
                    <li><input type="text" placeholder="Phone No"></li>
                    <li><input type="text" placeholder="Choose no of seats"></li>
                    <li><input type="text" placeholder="Second username"></li>
                    
                    <li class="button-container">
                        <button class="submit-btn">Submit</button>
                        <button class="cancel-btn">Cancel</button>
                    </li>
                </ul>
            </div>
        </div>  
    </div>
</body>
</html>
